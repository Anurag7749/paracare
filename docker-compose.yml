version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: datacare_postgres
    restart: always
    environment:
      POSTGRES_USER: paracare_user
      POSTGRES_PASSWORD: paracare_password
      POSTGRES_DB: paracare_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
